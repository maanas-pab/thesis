<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Chance all six coins finish green: 1.7 percent if you multiply the prices, 17 percent once correlation is priced">
  <defs>
    <linearGradient id="lime" x1="0" x2="1">
      <stop offset="0" stop-color="#9fd43a"/>
      <stop offset="1" stop-color="#c8f04a"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="460" rx="28"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .num { font-variant-numeric: tabular-nums; }
      .in { opacity: 0; animation: in .8s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.8s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
      .coin { opacity: 0; animation: pop .5s cubic-bezier(.2,1.4,.4,1) forwards; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
      .glow { animation: glow 2.6s ease-in-out 3s infinite; }
      @keyframes glow { 50% { opacity: .55; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="460" fill="#0b0b0c"/>

    <text class="sans in" x="64" y="76" fill="#c8f04a" font-size="16" font-weight="600" style="animation-delay:.05s">Why correlation matters</text>
    <text class="sans in" x="64" y="122" fill="#f5f5f7" font-size="36" font-weight="700" letter-spacing="-1.2" style="animation-delay:.15s">“All six coins close green today.” <tspan fill="#636366">What are the odds?</tspan></text>

    <!-- Six coins, each about a coin flip -->
    <g class="sans" font-size="13" font-weight="700" text-anchor="middle">
      <g class="coin" style="animation-delay:.4s"><circle cx="84" cy="182" r="18" fill="#f7931a"/><text x="84" y="187" fill="#fff">₿</text></g>
      <g class="coin" style="animation-delay:.5s"><circle cx="124" cy="182" r="18" fill="#627eea"/><text x="124" y="187" fill="#fff">Ξ</text></g>
      <g class="coin" style="animation-delay:.6s"><circle cx="164" cy="182" r="18" fill="#14b8a6"/><text x="164" y="187" fill="#fff">H</text></g>
      <g class="coin" style="animation-delay:.7s"><circle cx="204" cy="182" r="18" fill="#9945ff"/><text x="204" y="187" fill="#fff">S</text></g>
      <g class="coin" style="animation-delay:.8s"><circle cx="244" cy="182" r="18" fill="#3a3a3c"/><text x="244" y="187" fill="#fff">X</text></g>
      <g class="coin" style="animation-delay:.9s"><circle cx="284" cy="182" r="18" fill="#f4b728"/><text x="284" y="187" fill="#111">Z</text></g>
    </g>
    <text class="sans in" x="320" y="188" fill="#8e8e93" font-size="17" style="animation-delay:1s">Each one is priced near a coin flip on Gemini, 41¢ to 61¢.</text>

    <!-- Naive -->
    <text class="sans in" x="64" y="258" fill="#aeaeb2" font-size="18" style="animation-delay:1.2s">Multiply the six prices, as if the coins moved independently</text>
    <rect x="64" y="274" width="1072" height="40" rx="12" fill="#1c1c1e"/>
    <rect class="grow" x="64" y="274" width="19" height="40" rx="10" fill="#636366" style="animation-delay:1.4s"/>
    <text class="sans num in" x="100" y="301" fill="#f5f5f7" font-size="20" font-weight="700" style="animation-delay:2s">1.7%</text>

    <!-- Priced -->
    <text class="sans in" x="64" y="360" fill="#f5f5f7" font-size="18" font-weight="600" style="animation-delay:2.3s">Thesis, with correlations measured from two weeks of price moves</text>
    <rect x="64" y="376" width="1072" height="40" rx="12" fill="#1c1c1e"/>
    <g class="glow"><rect class="grow" x="64" y="376" width="186" height="40" rx="12" fill="url(#lime)" style="animation-delay:2.5s"/></g>
    <text class="sans num in" x="266" y="403" fill="#c8f04a" font-size="20" font-weight="700" style="animation-delay:3.4s">17%  <tspan fill="#8e8e93" font-weight="400" font-size="17">ten times likelier. Crypto moves together.</tspan></text>
  </g>
  <rect x=".5" y=".5" width="1199" height="459" rx="27.5" fill="none" stroke="#2c2c2e"/>
</svg>
